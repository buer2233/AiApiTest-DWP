[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --reuse-db
    --cov=accounts
    --cov=config
    --cov-report=term-missing
    --cov-report=html:tests/evidence/htmlcov
    --strict-markers
markers =
    api: DRF 接口测试
    command: Django 管理命令测试
