name: aiapitest-dwp

services:
  mysql:
    image: mysql:8.4
    container_name: aiapitest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ai_api_test_platform
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - target: 3306
        published: "${MYSQL_HOST_PORT:-3307}"
        host_ip: ${PLATFORM_BIND_HOST:-127.0.0.1}
        protocol: tcp
    volumes:
      - aiapitest-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aiapitest-platform

  jenkins:
    image: aiapitest-jenkins:lts-jdk17-tools
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    labels:
      aiapitest.base-image: jenkins/jenkins:lts-jdk17
    container_name: aiapitest-jenkins
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JENKINS_ENVIRONMENT_CATALOG_SYNC_SCM_URL: ${JENKINS_ENVIRONMENT_CATALOG_SYNC_SCM_URL:-}
      JENKINS_ENVIRONMENT_CATALOG_SYNC_SCM_BRANCH: ${JENKINS_ENVIRONMENT_CATALOG_SYNC_SCM_BRANCH:-main}
      JENKINS_ENVIRONMENT_CATALOG_SYNC_SCM_CREDENTIALS_ID: ${JENKINS_ENVIRONMENT_CATALOG_SYNC_SCM_CREDENTIALS_ID:-}
      JENKINS_ENVIRONMENT_CATALOG_SERVICE_CREDENTIALS_ID: ${JENKINS_ENVIRONMENT_CATALOG_SERVICE_CREDENTIALS_ID:-}
      JENKINS_ENVIRONMENT_CATALOG_SYNC_PUSH_CREDENTIALS_ID: ${JENKINS_ENVIRONMENT_CATALOG_SYNC_PUSH_CREDENTIALS_ID:-}
      JENKINS_API_TEST_E9_CREDENTIALS_ID: ${JENKINS_API_TEST_E9_CREDENTIALS_ID:-}
      FRONTEND_PLAYWRIGHT_BASE_IMAGE: ${FRONTEND_PLAYWRIGHT_BASE_IMAGE:-mcr.m.daocloud.io/playwright:v1.61.1-noble}
      CI_RUN_RETENTION_DAYS: ${CI_RUN_RETENTION_DAYS:-30}
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - target: 8080
        published: "${JENKINS_HTTP_PORT:-8080}"
        host_ip: ${PLATFORM_BIND_HOST:-127.0.0.1}
        protocol: tcp
      - target: 50000
        published: "${JENKINS_AGENT_PORT:-50001}"
        host_ip: ${PLATFORM_BIND_HOST:-127.0.0.1}
        protocol: tcp
    volumes:
      - aiapitest-jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/scripts/configure-executors.groovy:/var/jenkins_home/init.groovy.d/20-aiapitest-executors.groovy:ro
      - ./jenkins/scripts/25-aiapitest-retire-legacy-local-jobs.groovy:/var/jenkins_home/init.groovy.d/25-aiapitest-retire-legacy-local-jobs.groovy:ro
      - ./jenkins/scripts/configure-local-mounted-jobs.groovy:/var/jenkins_home/init.groovy.d/30-aiapitest-local-jobs.groovy:ro
      - ./jenkins/scripts/99-aiapitest-local-api-token.groovy:/var/jenkins_home/init.groovy.d/99-aiapitest-local-api-token.groovy:ro
      - ${PROJECT_WORKSPACE:-.}:/workspace/AiApiTest-DWP
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aiapitest-platform

  backend:
    image: aiapitest-backend:local
    build:
      context: .
      dockerfile: back-end/Dockerfile
      args:
        AIAPITEST_DEPENDENCY_HASH: ${BACKEND_DEPENDENCY_HASH:-unknown}
        AIAPITEST_BUILD_INPUT_HASH: ${BACKEND_BUILD_INPUT_HASH:-unknown}
        AIAPITEST_SOURCE_REVISION: ${AIAPITEST_SOURCE_REVISION:-unknown}
    container_name: aiapitest-backend
    restart: unless-stopped
    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--timeout",
        "60",
      ]
    environment:
      TZ: Asia/Shanghai
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      PLATFORM_BIND_HOST: ${PLATFORM_BIND_HOST:-127.0.0.1}
      PLATFORM_PUBLIC_HOST: ${PLATFORM_PUBLIC_HOST:-127.0.0.1}
      PLATFORM_PUBLIC_SCHEME: ${PLATFORM_PUBLIC_SCHEME:-http}
      MYSQL_HOST_PORT: ${MYSQL_HOST_PORT:-3307}
      JENKINS_HTTP_PORT: ${JENKINS_HTTP_PORT:-8080}
      BACKEND_HOST_PORT: ${BACKEND_HOST_PORT:-8000}
      FRONTEND_HOST_PORT: ${FRONTEND_HOST_PORT:-5173}
      MYSQL_DATABASE: ai_api_test_platform
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      JENKINS_USERNAME: ${JENKINS_USERNAME:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
      ENVIRONMENT_CATALOG_SERVICE_TOKEN: ${ENVIRONMENT_CATALOG_SERVICE_TOKEN:-}
    ports:
      - target: 8000
        published: "${BACKEND_HOST_PORT:-8000}"
        host_ip: ${PLATFORM_BIND_HOST:-127.0.0.1}
        protocol: tcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - aiapitest-platform

  backend-bootstrap:
    image: aiapitest-backend:local
    profiles: ["bootstrap"]
    environment:
      TZ: Asia/Shanghai
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      PLATFORM_BIND_HOST: ${PLATFORM_BIND_HOST:-127.0.0.1}
      PLATFORM_PUBLIC_HOST: ${PLATFORM_PUBLIC_HOST:-127.0.0.1}
      PLATFORM_PUBLIC_SCHEME: ${PLATFORM_PUBLIC_SCHEME:-http}
      MYSQL_HOST_PORT: ${MYSQL_HOST_PORT:-3307}
      JENKINS_HTTP_PORT: ${JENKINS_HTTP_PORT:-8080}
      BACKEND_HOST_PORT: ${BACKEND_HOST_PORT:-8000}
      FRONTEND_HOST_PORT: ${FRONTEND_HOST_PORT:-5173}
      MYSQL_DATABASE: ai_api_test_platform
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    networks:
      - aiapitest-platform

  frontend:
    image: aiapitest-frontend:local
    build:
      context: .
      dockerfile: front-end/Dockerfile
      target: runtime
      args:
        AIAPITEST_DEPENDENCY_HASH: ${FRONTEND_DEPENDENCY_HASH:-unknown}
        AIAPITEST_BUILD_INPUT_HASH: ${FRONTEND_BUILD_INPUT_HASH:-unknown}
        AIAPITEST_SOURCE_REVISION: ${AIAPITEST_SOURCE_REVISION:-unknown}
        PLAYWRIGHT_BASE_IMAGE: ${FRONTEND_PLAYWRIGHT_BASE_IMAGE:-mcr.m.daocloud.io/playwright:v1.61.1-noble}
    container_name: aiapitest-frontend
    restart: unless-stopped
    ports:
      - target: 80
        published: "${FRONTEND_HOST_PORT:-5173}"
        host_ip: ${PLATFORM_BIND_HOST:-127.0.0.1}
        protocol: tcp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - aiapitest-platform

  jenkins-sync-worker:
    image: aiapitest-backend:local
    build:
      context: .
      dockerfile: back-end/Dockerfile
      args:
        AIAPITEST_DEPENDENCY_HASH: ${BACKEND_DEPENDENCY_HASH:-unknown}
        AIAPITEST_BUILD_INPUT_HASH: ${BACKEND_BUILD_INPUT_HASH:-unknown}
        AIAPITEST_SOURCE_REVISION: ${AIAPITEST_SOURCE_REVISION:-unknown}
    container_name: aiapitest-jenkins-sync-worker
    restart: unless-stopped
    command:
      [
        "python",
        "manage.py",
        "sync_jenkins_results",
        "--watch",
        "--interval",
        "10",
      ]
    environment:
      TZ: Asia/Shanghai
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      PLATFORM_BIND_HOST: ${PLATFORM_BIND_HOST:-127.0.0.1}
      PLATFORM_PUBLIC_HOST: ${PLATFORM_PUBLIC_HOST:-127.0.0.1}
      PLATFORM_PUBLIC_SCHEME: ${PLATFORM_PUBLIC_SCHEME:-http}
      MYSQL_HOST_PORT: ${MYSQL_HOST_PORT:-3307}
      JENKINS_HTTP_PORT: ${JENKINS_HTTP_PORT:-8080}
      BACKEND_HOST_PORT: ${BACKEND_HOST_PORT:-8000}
      FRONTEND_HOST_PORT: ${FRONTEND_HOST_PORT:-5173}
      MYSQL_DATABASE: ai_api_test_platform
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      JENKINS_USERNAME: ${JENKINS_USERNAME:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
      JENKINS_SYNC_HEARTBEAT_PATH: /tmp/aiapitest-dwp/jenkins-sync-worker.heartbeat
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/worker_heartbeat_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - aiapitest-platform

  api-runner:
    image: aiapitest-api-runner:local
    build:
      context: .
      dockerfile: api-test/Dockerfile
      args:
        AIAPITEST_DEPENDENCY_HASH: ${API_RUNNER_DEPENDENCY_HASH:-unknown}
        AIAPITEST_BUILD_INPUT_HASH: ${API_RUNNER_BUILD_INPUT_HASH:-unknown}
        AIAPITEST_SOURCE_REVISION: ${AIAPITEST_SOURCE_REVISION:-unknown}
    profiles: ["tools"]
    restart: "no"
    working_dir: /workspace/AiApiTest-DWP/api-test
    command: ["python", "-m", "pytest", "tests", "-q"]
    networks:
      - aiapitest-platform

volumes:
  aiapitest-mysql-data:
    name: aiapitest-mysql-data
  aiapitest-jenkins-home:
    name: aiapitest-jenkins-home

networks:
  aiapitest-platform:
    name: aiapitest-platform
